<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job OS — Offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
         font-family: "Hiragino Sans", system-ui, sans-serif; background: #f3f5f8; color: #172033; }
  @media (prefers-color-scheme: dark) { body { background: #0f1626; color: #e8edf5; } }
  button { min-height: 44px; padding: 0 16px; border-radius: 6px; border: 0; font: inherit; font-weight: 700; background: #172033; color: #f3f5f8; }
</style>
</head>
<body>
  <div>
    <h1>Offline</h1>
    <p>Live data and actions are unavailable.<br>Nothing is stored on this phone, so there is nothing to show until you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
