<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job OS — Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
         font-family: "Hiragino Sans", system-ui, sans-serif; background: #0b1628; color: #f4f7fb; }
  p { color: #9fb0c9; }
  button { min-height: 48px; padding: 0 22px; border-radius: 12px; border: 0; font: inherit; font-weight: 700; background: #1463ff; color: #fff; box-shadow: 0 6px 16px rgba(20,99,255,.35); }
</style>
</head>
<body>
  <div>
    <h1>Offline</h1>
    <p>Live data and actions are unavailable.<br>Nothing is stored on this phone, so there is nothing to show until you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
